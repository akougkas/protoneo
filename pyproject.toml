[project]
name = "protoneo"
version = "0.1.0"
description = "Composable LLM deliberation runtime"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0" }
authors = [
    { name = "ProtoNeo Team" }
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "websockets>=13.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "litellm>=1.50.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "docling>=2.0.0",
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    "pyyaml>=6.0.0",
    "markdown>=3.0.0",
    "weasyprint>=62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
protoneo = "protoneo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["protoneo", "apps"]
