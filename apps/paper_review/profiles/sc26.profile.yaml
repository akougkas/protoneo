conference:
  slug: sc26
  name: "International Conference for High Performance Computing, Networking, Storage, and Analysis"
  short_name: "SC '26"
  location: "St. Louis, Missouri, United States"
  dates: "2026-11-15 to 2026-11-20"
  presentation_dates: "2026-11-17 to 2026-11-19"
  paper_types:
    - id: technical
      label: "Technical Paper"
    - id: state_of_practice
      label: "State of the Practice Paper"

scope:
  summary: >-
    The SC Papers program is the leading venue for presenting high-quality
    original research, groundbreaking ideas, and compelling insights on
    current and future trends in high performance computing, networking,
    storage, and analysis. Small-scale studies, including single-node
    studies, are welcome as long as the paper clearly conveys its
    contribution to high performance computing.
  must_show_scope_connection: true
  topics:
    - "Algorithms (scalable, general-purpose, high performance)"
    - "Applications (parallel implementations for specific HPC domains)"
    - "Architecture & Networks (processors, interconnects, memory, I/O)"
    - "Data Analytics, Visualization, & Storage"
    - "HPC for Machine Learning (scalable ML utilizing HPC)"
    - "Performance Measurement, Modeling, & Tools"
    - "Post-Moore & Quantum Computing"
    - "Programming Frameworks (compilers, languages, runtimes)"
    - "State of the Practice (operational HPC infrastructure and insights)"
    - "System Software & Cloud Computing (HPC/cloud/edge convergence)"
  areas:
    - id: algorithms
      label: "Algorithms"
      description: "Scalable, general-purpose, high performance algorithms"
    - id: applications
      label: "Applications"
      description: "Algorithms, parallel implementations, models, and software for specific applications requiring HPC"
    - id: architecture_networks
      label: "Architecture & Networks"
      description: "All aspects of high performance hardware including processors and networks"
    - id: data_analytics_vis_storage
      label: "Data Analytics, Visualization, & Storage"
      description: "Data analytics, visualization, storage, and storage I/O related to HPC systems"
    - id: hpc_for_ml
      label: "HPC for Machine Learning"
      description: "Algorithms, systems, and software for scalable ML utilizing HPC technology"
    - id: performance
      label: "Performance Measurement, Modeling, & Tools"
      description: "Novel methods and tools for measuring, evaluating, and analyzing performance"
    - id: post_moore_quantum
      label: "Post-Moore & Quantum Computing"
      description: "Technologies continuing HPC performance scaling beyond Moore's law"
    - id: programming_frameworks
      label: "Programming Frameworks"
      description: "Compilers, languages, libraries, programming models, and runtime systems"
    - id: state_of_practice
      label: "State of the Practice"
      description: "Pragmatic practices of HPC including operational infrastructure, services, and facilities"
    - id: system_software_cloud
      label: "System Software & Cloud Computing"
      description: "Cloud and system software architecture, configuration, optimization, and evaluation"

submission:
  max_pages_excluding_references: 10
  format: "IEEE proceedings (two-column, U.S. letter 8.5x11)"
  dual_anonymous: true
  require_paper_type_in_title: false
  paper_checklist_mandatory: true
  artifact_description:
    mandatory: true
    note: "AD appendix or explanation of why there is no AD is required"
  artifact_evaluation:
    mandatory: false
    note: "AE appendix is optional"
  appendix_pages_excluded_from_limit: true
  checklist_excluded_from_limit: true
  key_dates:
    abstracts_close: "2026-04-01"
    papers_close: "2026-04-08"
    ad_appendix_due: "2026-04-24"
    review_rebuttal: "2026-06-08 to 2026-06-11"
    notifications: "2026-07-01"
    final_paper_due: "2026-08-28"

review_form:
  overall_merit:
    scale: [1, 5]
    labels:
      1: Strong reject
      2: Reject
      3: Borderline
      4: Accept
      5: Strong accept
  reviewer_expertise:
    scale: [1, 4]
    labels:
      1: No familiarity
      2: Some familiarity
      3: Knowledgeable
      4: Expert
  sections:
    - paper_summary
    - strengths
    - weaknesses
    - questions_for_authors
    - comments_for_authors
    - comments_for_pc

review_process:
  type: double_anonymous
  reviewers_per_paper: "3-4"
  has_rebuttal: true
  rebuttal_is_anonymous: true
  note: >-
    Papers not respecting submission guidelines are subject to immediate
    rejection without review. This includes violations of double-anonymous
    policy, page limit, and missing AD artifacts.

preflight_checks:
  - scope_fit
  - page_limit
  - anonymization
  - required_sections
  - limitations_present
  - artifact_description_present
  - paper_checklist_present
  - experimental_scale_appropriate

panel:
  pattern: independent_synthesis
  deliberation_rounds: 2
  phases:
    - independent_review
    - deliberation
    - meta_review
  agents:
    technical:
      role: "Technical Depth Reviewer"
      focus:
        - algorithmic correctness and theoretical grounding
        - scalability analysis across node counts and problem sizes
        - experimental methodology and statistical rigor
        - baseline comparisons against current state of the art
        - whether results generalize beyond the specific testbed
    systems:
      role: "Systems and Architecture Reviewer"
      focus:
        - system design and architectural decisions
        - implementation quality and engineering rigor
        - hardware utilization efficiency (compute, memory, network, storage)
        - performance engineering practices
        - deployment feasibility at production HPC scale
    novelty:
      role: "Novelty and Impact Reviewer"
      focus:
        - originality of contribution to the HPC community
        - significance and potential for long-term impact
        - positioning against state of the art
        - whether the paper advances practice, not just theory
    skeptic:
      role: "Adversarial Skeptic"
      focus:
        - overclaiming relative to experimental evidence
        - missing ablations or sensitivity analyses
        - unsupported generalizations from limited testbeds
        - hidden assumptions about hardware, workloads, or scale
        - reproducibility gaps and missing experimental details
    meta_reviewer:
      role: "Meta-Reviewer"
      focus:
        - synthesis of all reviews into coherent assessment
        - consensus and disagreement analysis
        - area-appropriate evaluation criteria
        - final recommendation with justification
        - prioritized revision plan for authors
  optional_agents:
    artifact:
      role: "Artifact and Reproducibility Reviewer"
      focus:
        - artifact description completeness (mandatory for SC)
        - reproducibility of reported results
        - code, data, and environment availability
        - whether results can be independently verified
        - badge eligibility assessment
    scalability:
      role: "Scalability and Performance Reviewer"
      focus:
        - strong and weak scaling behavior
        - performance at production HPC scale
        - communication and synchronization overhead
        - comparison with theoretical performance bounds

awards:
  - id: best_paper
    label: "Best Paper (BP)"
    note: "Nominations made during review"
  - id: best_student_paper
    label: "Best Student Paper (BSP)"
    note: "Nominations made during review"
  - id: best_reproducibility
    label: "Best Reproducibility Advancement (BRA)"
    note: "Nominations made during review"

output:
  author_packet_sections:
    - venue_fit
    - area_assessment
    - preflight_warnings
    - individual_reviews
    - deliberation_summary
    - meta_review
    - decision_risk_notes
    - revision_plan
  export_formats:
    - markdown
    - pdf
    - json

responsible_ai:
  intended_user: "manuscript_author"
  positioning: "pre-submission author feedback tool"
  reviewer_outsourcing_positioning: false
  require_grounded_citations: true
  encourage_local_or_byok_models: true
  manuscript_retention_default: "configurable_minimal"
  disclosure_note: >-
    This is a simulated review for author self-improvement before submission.
    Authors remain responsible for correctness, accuracy, and any venue-specific
    AI disclosure requirements. SC requires disclosure of AI-generated text
    in the acknowledgments section.
