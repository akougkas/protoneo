conference:
  slug: hpdc26
  name: "ACM International Symposium on High-Performance Parallel and Distributed Computing"
  short_name: "HPDC '26"
  location: "Cleveland, Ohio, United States"
  dates: "2026-07-13 to 2026-07-16"
  paper_types:
    - id: regular
      label: "Regular Paper"
    - id: open_source_tools_data
      label: "Open-Source Tools and Data Paper"

scope:
  summary: >-
    Premier symposium for high-performance parallel and distributed computing.
    Submissions must show a clear connection to HPDC topics. Papers that are
    purely about machine learning, networking, or general optimization without
    a parallel/distributed computing angle are out of scope.
  must_show_connection_to_hpdc: true
  topics:
    - datacenter, HPC, cloud, serverless, and edge/IoT platforms
    - accelerators and heterogeneous computing
    - memory systems
    - file and storage systems, I/O, and data management
    - operating systems and networks
    - system software and middleware
    - programming languages and runtime systems
    - big data stacks and ecosystems
    - AI for HPDC and HPDC for AI workloads
    - scientific applications, algorithms, and workflows
    - resource management and scheduling
    - performance modeling and benchmarking
    - fault tolerance, reliability, and availability
    - deployment guarantees, risk assessment, and management
    - energy efficiency and sustainability
    - software engineering for parallel and distributed systems
    - post-Moore computing technologies

submission:
  max_pages_excluding_references: 11
  camera_ready_extra_pages: 1
  format: "ACM sigconf"
  dual_anonymous: true
  require_paper_type_in_title: true
  optional_appendix:
    artifact_description_or_evaluation: true
    max_pages: 2

review_form:
  overall_merit:
    scale: [1, 5]
    labels:
      1: Reject
      2: Weak reject
      3: Borderline
      4: Accept
      5: Strong accept
  reviewer_expertise:
    scale: [1, 4]
    labels:
      1: No familiarity
      2: Some familiarity
      3: Knowledgeable
      4: Expert
  sections:
    - paper_summary
    - strengths
    - weaknesses
    - comments_for_authors
    - comments_for_pc

preflight_checks:
  - scope_fit
  - paper_type_declared
  - page_limit
  - anonymization
  - required_sections
  - limitations_present
  - artifact_statement_present
  - experimental_setup_specificity

panel:
  pattern: independent_synthesis
  deliberation_rounds: 2
  phases:
    - independent_review
    - deliberation
    - meta_review
  agents:
    technical:
      role: "Technical Depth Reviewer"
      focus:
        - methodology and systems design soundness
        - evaluation rigor and statistical validity
        - baseline fairness and recency
        - reproducibility and implementation specificity
        - whether conclusions follow from evidence
    novelty:
      role: "Novelty and Positioning Reviewer"
      focus:
        - originality of contribution
        - significance to the parallel/distributed computing community
        - positioning against prior work
        - venue fit (explicit HPDC connection required)
    clarity:
      role: "Clarity and Presentation Reviewer"
      focus:
        - writing quality and paper structure
        - figure and table readability
        - notation consistency
        - accessibility to the HPDC audience
        - whether the paper tells a coherent story
    skeptic:
      role: "Adversarial Skeptic"
      focus:
        - overclaiming relative to evidence
        - missing controls or ablations
        - unsupported generalizations
        - hidden assumptions in experimental setup
    meta_reviewer:
      role: "Meta-Reviewer"
      focus:
        - synthesis of all reviews into coherent assessment
        - consensus and disagreement analysis
        - final recommendation with justification
        - prioritized revision plan for authors
  optional_agents:
    artifact:
      role: "Artifact and Reproducibility Reviewer"
      focus:
        - artifact description completeness
        - reproducibility of reported results
        - code and data availability signals

output:
  author_packet_sections:
    - venue_fit
    - preflight_warnings
    - individual_reviews
    - deliberation_summary
    - meta_review
    - decision_risk_notes
    - revision_plan
  export_formats:
    - markdown
    - pdf
    - json

responsible_ai:
  intended_user: "manuscript_author"
  positioning: "pre-submission author feedback tool"
  reviewer_outsourcing_positioning: false
  require_grounded_citations: true
  encourage_local_or_byok_models: true
  manuscript_retention_default: "configurable_minimal"
  disclosure_note: >-
    This is a simulated review for author self-improvement before submission.
    Authors remain responsible for correctness, accuracy, and any venue-specific
    AI disclosure requirements.
