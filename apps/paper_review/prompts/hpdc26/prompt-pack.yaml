conference: hpdc26
mode: author_pre_submission
version: 0.1.0

composition:
  shared: "prompts/hpdc26/shared.md"
  roles:
    technical:
      path: "prompts/hpdc26/technical.md"
      phase: independent_review
      default_model_hint: "openai/gpt-5.4"
    novelty:
      path: "prompts/hpdc26/novelty.md"
      phase: independent_review
      default_model_hint: "openai/gpt-5.4-mini"
    clarity:
      path: "prompts/hpdc26/clarity.md"
      phase: independent_review
      default_model_hint: "openai/gpt-4o"
    skeptic:
      path: "prompts/hpdc26/skeptic.md"
      phase: independent_review
      default_model_hint: "ollama/qwen3:32b"
    artifact:
      path: "prompts/hpdc26/artifact.md"
      phase: independent_review
      optional: true
    meta:
      path: "prompts/hpdc26/meta.md"
      phase: meta_review
      default_model_hint: "openai/gpt-5.4"

inputs:
  required:
    - conference_profile
    - manuscript_text
    - manuscript_sections
  optional:
    - preflight_report
    - appendix_text
    - prior_reviews
    - deliberation_history
    - figure_table_index

review_scales:
  overall_merit:
    range: [1, 5]
    labels:
      1: Reject
      2: Weak reject
      3: Borderline
      4: Accept
      5: Strong accept
  expertise:
    range: [1, 4]
    labels:
      1: No familiarity
      2: Some familiarity
      3: Knowledgeable
      4: Expert

guardrails:
  dual_anonymous: true
  no_identity_speculation: true
  no_chain_of_thought: true
  require_grounding: true
  position_as_simulated_panel: true
  position_as_author_facing: true
