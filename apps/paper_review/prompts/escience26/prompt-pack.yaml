conference: escience26
mode: author_pre_submission
version: 0.1.0

composition:
  shared: "prompts/escience26/shared.md"
  roles:
    technical:
      path: "prompts/escience26/technical.md"
      phase: independent_review
      default_model_hint: "openai/gpt-5.5"
    systems:
      path: "prompts/escience26/systems.md"
      phase: independent_review
      default_model_hint: "openai/gpt-5.5-mini"
    novelty:
      path: "prompts/escience26/novelty.md"
      phase: independent_review
      default_model_hint: "openai/gpt-4o"
    artifact:
      path: "prompts/escience26/artifact.md"
      phase: independent_review
      default_model_hint: "openai/gpt-5.5-mini"
    skeptic:
      path: "prompts/escience26/skeptic.md"
      phase: independent_review
      default_model_hint: "ollama/qwen3:32b"
    meta:
      path: "prompts/escience26/meta.md"
      phase: meta_review
      default_model_hint: "openai/gpt-5.5"

inputs:
  required:
    - conference_profile
    - manuscript_text
    - manuscript_sections
  optional:
    - preflight_report
    - appendix_text
    - prior_reviews
    - deliberation_history
    - figure_table_index
    - review_assumptions

review_scales:
  overall_merit:
    range: [1, 5]
    labels:
      1: Reject
      2: Weak reject
      3: Borderline
      4: Accept
      5: Strong accept
  expertise:
    range: [1, 4]
    labels:
      1: No familiarity
      2: Some familiarity
      3: Knowledgeable
      4: Expert

guardrails:
  single_blind: true
  no_identity_speculation: true
  no_chain_of_thought: true
  require_grounding: true
  position_as_simulated_panel: true
  position_as_author_facing: true
  require_ai_disclosure_check: true
  require_fair_reproducibility_check: true
